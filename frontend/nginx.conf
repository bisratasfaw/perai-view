# PerAI View web app: serves the Vite build and proxies /api (REST + WebSocket) to the
# backend container. Installed as /etc/nginx/conf.d/default.conf (inside the http block) of the
# unprivileged nginx image, which runs as a non-root user and therefore listens on port 8080.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Hashed Vite output can be cached forever. Cesium's files keep the same URL across
# Cesium versions (/cesium/Cesium.js), so they get a long but finite cache instead of
# `immutable`. Everything else (index.html, favicon) is revalidated on every load.
map $uri $perai_cache_control {
    default      "no-cache";
    ~^/assets/   "public, max-age=31536000, immutable";
    ~^/cesium/   "public, max-age=604800";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/wasm image/svg+xml;

    # Docker's embedded DNS. Resolving at request time (via the variable below) lets nginx
    # start before the backend exists and follow it if the container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $perai_api http://backend:4000;

    # Live activity feed (WebSocket upgrade). The backend pings every 30 s.
    location /api/ws/ {
        proxy_pass $perai_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # REST API. Security headers for API responses come from the backend (helmet).
    location /api/ {
        proxy_pass $perai_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Static app. The app has a single page (state lives in the query string), so there is
    # no SPA fallback: a missing file is a real 404, never index.html served as JavaScript.
    location / {
        try_files $uri $uri/ =404;

        add_header Cache-Control $perai_cache_control always;
        # What the policy allows, and why (verified against a production build in Chromium):
        # - script-src 'unsafe-eval': Cesium's prebuilt Cesium.js bundles Knockout and Emscripten
        #   glue that call eval / new Function; without it the globe fails to start. No inline
        #   scripts and no third-party script origins are allowed.
        # - script-src/worker-src blob:: Cesium wraps its workers in blob: URLs that importScripts.
        # - img-src/connect-src data: blob:: imagery decoding; the heat map is a canvas data: URL.
        # - gibs.earthdata.nasa.gov: NASA imagery tiles (fetched with CORS).
        # - style-src 'unsafe-inline': index.html's boot styles and React style attributes.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://gibs.earthdata.nasa.gov; font-src 'self' data:; connect-src 'self' data: blob: https://gibs.earthdata.nasa.gov; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
    }
}
