<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PerAI View: a live globe of simulated AI activity</title>
    <meta name="description" content="An interactive 3D globe that visualises simulated AI-assistant activity around the world in real time. Open source, built with React, CesiumJS, Node.js and a scikit-learn classifier." />
    <meta name="theme-color" content="#03070d" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="PerAI View" />
    <meta property="og:description" content="An interactive 3D globe of simulated AI-assistant activity. Open source; React, CesiumJS, Node.js." />
    <meta property="og:image" content="__SITE_URL__og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PerAI View" />
    <meta name="twitter:description" content="An interactive 3D globe of simulated AI-assistant activity." />
    <meta name="twitter:image" content="__SITE_URL__og-image.png" />

    <style>
      html, body { margin: 0; height: 100%; background: #03070d; }
      #root { height: 100%; }
      .boot {
        position: fixed; inset: 0; display: grid; place-content: center; gap: 18px; justify-items: center;
        color: #aebccb; font: 500 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.02em;
        background: radial-gradient(60% 60% at 50% 45%, #0b1a2c 0%, #03070d 70%);
      }
      .boot-orb {
        width: 64px; height: 64px; border-radius: 50%;
        border: 1.5px solid rgba(92, 200, 255, 0.25); border-top-color: #5cc8ff;
        animation: boot-spin 1.1s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-orb { animation: none; border-color: #5cc8ff; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-orb" aria-hidden="true"></div>
        <span>Loading PerAI View…</span>
      </div>
    </div>
    <noscript><p style="color:#e8eef5;font-family:system-ui;padding:24px">PerAI View needs JavaScript and WebGL to draw the globe.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
