version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /frontend
      - /backend
      - /data-pipeline
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /ai-classifier
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /frontend
      - /backend
      - /ai-classifier
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
