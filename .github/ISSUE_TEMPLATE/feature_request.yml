name: Feature request
description: Suggest an improvement or a new feature.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        PerAI View visualises simulated data only. Ideas that would collect or display real
        user data are out of scope.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation or limitation, not only the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Globe and map layers
        - Analytics and data presentation
        - Simulation model (shared/)
        - Backend API
        - Activity classifier
        - Accessibility
        - Tooling, CI or deployment
        - Documentation
    validations:
      required: true
